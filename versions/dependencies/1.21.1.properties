# Per-version dependency coordinates for MC 1.21.1.
# Stonecraft reads minecraft_version + the loader version(s) to provision MC and the
# loader; the remaining keys are custom and read in build.gradle.kts via property("...").
minecraft_version=1.21.1
neoforge_version=21.1.220
# Fabric loader + Fabric API (Stonecraft auto-provisions the loader from loader_version).
loader_version=0.16.14
fabric_version=0.116.15+1.21.1

# Architectury API — cross-loader events/networking/keybinds/platform (loader-specific artifact).
architectury_version=13.0.11

# --- optional / dev-only-runtime mods (used to test kjsgen against real recipe types) ---
# JEI publishes the same version number for both the neoforge and fabric variants.
jei_version=19.27.0.346
kubejs_version=2101.7.2-build.369
# KubeJS runtime-scoped transitives — Loom pulls compile-scope transitives of modLocalRuntime
# (e.g. rhino) but NOT runtime-scope ones, so KubeJS's own runtime deps must be listed explicitly
# or its client init crashes (ClassNotFoundException: dev.latvian.apps.tinyserver...).
# Pin tiny-java-server to build.33 (KubeJS's declared minimum): newer builds (e.g. .45) dropped
# WSHandler.empty(), which KubeJS 2101.7.2 calls -> NoSuchMethodError with the latest.
tiny_java_server_version=1.0.0-build.33
better_advanced_tooltips_version=2101.1.0-build.4
animated_gif_lib_version=animated-gif-lib-1.7
kubejs_mekanism_version=2101.1.7-build.18
kubejs_create_version=2101.3.1-build.18
mekanism_version=1.21.1-10.7.19.85
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
