# Per-version dependency coordinates for MC 1.20.1 (Forge loader).
# Stonecraft reads minecraft_version + forge_version to provision MC and the loader; the rest are
# custom keys read in build.gradle.kts via property("..."). NOTE: no yarn_mappings key here on
# purpose — Stonecraft only switches to Yarn when yarn_mappings is present; without it the whole
# project builds against loom.officialMojangMappings() (Mojmap), the same names 1.21.1-neoforge
# uses, so the shared src/main compiles identically on both chunks.
minecraft_version=1.20.1
forge_version=1.20.1-47.4.22

# Architectury API — 9.x is the 1.20.1 line (NeoForge's Architectury only starts at 1.20.4).
architectury_version=9.2.14

# --- optional / dev-only-runtime mods (test kjsgen against real recipe types) ---
# 1.20.1 is Forge-native for these: KubeJS/JEI have no NeoForge 1.20.1 build (KubeJS NeoForge
# starts at 1.20.4), which is exactly why this target is Forge, not NeoForge.
jei_version=15.21.0.148
# KubeJS 6 (2001.x). Unlike KubeJS 7 on 1.21.1 it has no tiny-java-server runtime dep — its only
# non-bundled runtime lib is Rhino (a Forge mod), so no forgeRuntimeLibrary juggling is needed.
kubejs_version=2001.6.5-build.26
rhino_version=2001.2.3-build.10
# KubeJS/Rhino use MixinExtras; its -forge jar loads as a mod but the -common classes (holding
# MixinExtrasBootstrap, needed during early mixin bootstrap) are a non-mod transitive Loom drops,
# so they must be added explicitly as a forgeRuntimeLibrary. Pinned to KubeJS's declared version.
mixinextras_version=0.2.0-rc.2

# Mekanism and Create integration on 1.20.1-forge is a follow-up (Milestone B): Mekanism 10.4 and
# JEI 15 APIs differ enough from the 1.21.1 (10.7 / JEI 19) code that the forge branches need real
# porting. Their dev-runtime coordinates get added here when that work lands.
