name: CI Verify

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test all versions
        run: ./gradlew chiseledBuildAndCollect --stacktrace

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-verify-jars
          path: |
            build/libs/*.jar
            build/reports/**/*
