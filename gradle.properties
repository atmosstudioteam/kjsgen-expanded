# --- Gradle ---
# Stonecutter + Architectury Loom builds do not support the configuration cache or
# parallel/caching cleanly, so keep them off (mirrors the Stonecraft template).
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false

# --- Mod metadata (consumed by Stonecraft variable substitution: ${id}, ${name}, ...) ---
mod.id=kjsgen
mod.name=KubeJS Generator
mod.version=2.0.0
mod.group=com.zizazr.kjsgen
mod.description=A JEI-like visual recipe editor that exports KubeJS server scripts.
